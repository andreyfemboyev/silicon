name: Release bundles
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            bundles: deb,appimage
          - os: windows-2025
            name: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix desktop/ui
      - run: npm --prefix desktop/ui run build
      - run: cargo test --locked --workspace --features silicon-desktop/custom-protocol
      - working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./ui/node_modules/.bin/tauri build --ci --bundles "${{ matrix.bundles }}"
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked -p silicon --release --target x86_64-unknown-linux-musl
          mkdir -p release/cli
          cp target/x86_64-unknown-linux-musl/release/silicon LICENSE README.md release/cli/
          ./release/cli/silicon test
          tar -czf release/silicon-cli-linux-x86_64.tar.gz -C release/cli silicon LICENSE README.md
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage release/
          cd release
          sha256sum *.tar.gz *.deb *.AppImage > SHA256SUMS.txt
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p silicon --release
          New-Item -ItemType Directory -Path release/cli -Force
          Copy-Item -Path target/release/silicon.exe,LICENSE,README.md -Destination release/cli/
          ./release/cli/silicon.exe test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path release/cli/* -DestinationPath release/silicon-cli-windows-x86_64.zip
          Copy-Item target/release/bundle/nsis/*.exe release/
          Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-${{ matrix.name }}
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
