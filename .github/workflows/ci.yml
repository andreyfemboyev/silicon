name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --prefix desktop/ui
      - run: npm --prefix desktop/ui run build
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features silicon-desktop/custom-protocol -- -D warnings
      - run: cargo test --locked --workspace --features silicon-desktop/custom-protocol
      - run: cargo build --locked -p silicon
      - if: runner.os == 'Linux'
        working-directory: desktop/ui
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        working-directory: desktop/ui
        run: npx playwright install chromium
      - run: npm --prefix desktop/ui test
