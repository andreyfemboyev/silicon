[workspace]
members = ["core", "cli", "desktop"]
default-members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
silicon-core = { path = "core" }
